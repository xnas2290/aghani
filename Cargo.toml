[package]
name = "aghani"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
crossterm = "0.29.0"
dirs-next = "2.0.0"
image = "0.25.10"
lofty = "0.23.3"
ratatui = "0.30"
rodio = { version = "0.17", features = ["mp3"] }
walkdir = "2.5.0"
ratatui-image = { version = "10.0.6", features = ["crossterm"] }
crossbeam-channel = "0.5"
symphonia = { version = "0.5", features = [
    "aac",
    "mp3",
    "flac",
    "vorbis",
    "isomp4",
    "wav"
] }
unicode-width = "0.2.2"
pathdiff = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2.184"
toml = "1.1.2"
mpris-server = "0.9"
tokio = { version = "1", features = ["full"] }
zvariant = "4.0"
async-std = { version = "1", features = ["attributes"] }
smol = "2"
color-thief = "0.2"  #